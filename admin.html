<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JKT48 Theater Seating Stats</title>
<style>
body{margin:0;background:#0d090d;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit}
.wrap{padding:40px 20px;display:flex;flex-direction:column;align-items:center;width:100%;max-width:1280px;box-sizing:border-box}
.head{text-align:center;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;width:100%}
h1{font-size:42px;font-weight:900;color:#ff2a5f;margin:0 0 8px;letter-spacing:-.5px;text-shadow:0 0 20px rgba(255,42,95,.3)}
.sub{color:#a1a1aa;font-size:15px;margin:0 0 24px}
.tabs{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.tab-btn{padding:10px 28px;border-radius:9999px;border:1px solid #332128;background:#1a1014;color:#a1a1aa;font-size:15px;font-weight:600;cursor:pointer;transition:.25s}
.tab-btn:hover{border-color:#ff2a5f;color:#fff}
.tab-btn.active{background:#881337;border-color:#f43f5e;color:#fff;box-shadow:0 0 15px rgba(244,63,94,.3)}
:focus-visible{outline:2px solid #ff8c00;outline-offset:2px}
.badge{background:#181115;border:1px solid #2d1820;padding:8px 20px;border-radius:9999px;font-size:15px;font-weight:600;color:#e4e4e7}
.badge span{color:#ff2a5f;font-weight:800}
.view{display:none;width:100%}
.view.active{display:flex;flex-direction:column;align-items:center}
#seating-wrapper{width:100%;overflow-x:auto;padding-bottom:20px;box-sizing:border-box;-webkit-overflow-scrolling:touch}
#stage-container{width:max-content;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.stage{width:100%;background:linear-gradient(180deg,#380816,#17040a);border:1px solid #881337;border-bottom:none;border-radius:12px 12px 0 0;padding:14px 0;text-align:center;box-shadow:0 -4px 20px rgba(136,19,55,.3);box-sizing:border-box;color:#ff2a5f;font-weight:900;letter-spacing:5px;font-size:15px}
.arena{display:flex;align-items:flex-start;gap:38px;width:100%;box-sizing:border-box;position:relative}
.arena::before{content:'';position:absolute;top:0;left:38px;right:38px;border-top:1px solid #881337;box-shadow:0 2px 14px rgba(136,19,55,.45)}
.catwalk{width:38px;height:318px;background:#17040a;border:1px solid #881337;border-top:none;border-radius:0 0 8px 8px;box-shadow:0 6px 15px rgba(136,19,55,.25);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;color:#ff2a5f;font-size:11px;font-weight:800;letter-spacing:3px;box-sizing:border-box;flex-shrink:0;user-select:none}
#seating-chart-container{display:flex;gap:20px;margin-top:15px}
.seat-block{display:flex;flex-direction:column;gap:6px}
.block-1,.block-3{align-items:flex-end}.block-2,.block-4{align-items:flex-start}
.seat-row{display:flex;gap:5px;height:48px;align-items:center}
.seat{width:38px;height:46px;border-radius:6px;border:1px solid #3d0815;background:#1e050c;color:#f43f5e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0;cursor:pointer;transition:.2s;flex-shrink:0}
.seat:hover{transform:translateY(-2px) scale(1.05);border-color:#ff2a5f;box-shadow:0 4px 12px rgba(255,42,95,.3);z-index:5}
.seat.visited{background:#ff8c00;border-color:#ffaa00;color:#000;font-weight:900;box-shadow:0 0 12px rgba(255,140,0,.5)}
.seat-count{font-size:11px;font-weight:900;margin-top:3px;background:#000;color:#fff;border-radius:99px;padding:1px 5px;line-height:1}
.crud{width:100%;max-width:1200px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;margin-top:20px}
.card{background:#140d11;border:1px solid #2a1820;border-radius:16px;padding:24px;box-sizing:border-box}
.card h3{margin:0 0 18px;font-size:18px;color:#ff2a5f}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:13px;color:#a1a1aa;font-weight:600}
input,textarea,select{background:#1d1318;border:1px solid #3d222e;border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;width:100%}
input:focus,textarea:focus,select:focus{border-color:#ff2a5f}
#msg{font-size:13px;margin-top:10px;min-height:16px;color:#f87171}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{padding:12px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid #3f3f46;background:#27272a;color:#d4d4d8}
.btn.main{flex:1;background:#881337;border-color:#f43f5e;color:#fff}
#btn-cancel{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bar h3{margin:0}
#search{max-width:200px;padding:8px 12px;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tools .btn{padding:8px 14px;font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;min-width:600px}
th{background:#1d1318;color:#a1a1aa;padding:12px 10px;font-weight:600;border-bottom:1px solid #3d222e}
td{padding:12px 10px;border-bottom:1px solid #24151d;color:#e4e4e7}
.seat-badge{background:#ff8c00;color:#000;padding:3px 8px;border-radius:6px;font-weight:800;font-size:12px}
.seat-badge.bad{background:#dc2626;color:#fff}
.ts-ya,.ts-no{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.ts-ya{background:#059669;color:#fff}.ts-no{background:#27272a;color:#a1a1aa;font-weight:600}
.act{padding:6px 10px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;margin-right:4px;color:#fff}
.edit{background:#2563eb}.del{background:#dc2626}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center;padding:15px;box-sizing:border-box}
.overlay.open{display:flex}
.modal{background:#140d11;border:1px solid #3d222e;border-radius:16px;width:100%;max-width:440px;padding:24px;position:relative;box-sizing:border-box}
.x{position:absolute;top:16px;right:16px;background:none;border:none;color:#a1a1aa;font-size:22px;cursor:pointer}
.hist{display:flex;flex-direction:column;gap:10px;max-height:250px;overflow-y:auto;margin-top:16px}
.hi{background:#1d1318;padding:12px 14px;border-radius:8px;border-left:4px solid #ff8c00}
.hi b{font-size:15px}.hd{font-size:13px;color:#ff2a5f;margin-top:2px}
.hn{font-size:13px;color:#a1a1aa;margin-top:4px;font-style:italic}
.ht{font-size:12px;color:#34d399;margin-top:4px;font-weight:600}
.empty{color:#71717a;font-size:14px;text-align:center;padding:16px 0}
.thumb{display:block;width:44px;height:44px;object-fit:cover;border-radius:6px;margin-top:6px;cursor:zoom-in;border:1px solid #3d222e}

.pprev{display:none;align-items:center;gap:10px;margin-top:6px}
.pprev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #3d222e}
.pprev .btn{padding:6px 10px;font-size:12px}
.hi img{display:block;max-width:100%;max-height:160px;border-radius:8px;margin-top:8px;cursor:zoom-in}
#lb-img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 0 30px rgba(0,0,0,.6)}
#lightbox{cursor:zoom-out;z-index:200}
@media(max-width:900px){.crud{grid-template-columns:1fr}}
@media(max-width:768px){
h1{font-size:28px}.sub{font-size:13px;margin-bottom:16px}.wrap{padding:20px 12px}
.tab-btn{padding:8px 18px;font-size:13px}
.seat{width:32px;height:38px;font-size:10px}.seat-row{height:40px;gap:4px}
#seating-chart-container{gap:12px;margin-top:10px}
.catwalk{width:30px;height:260px;font-size:9px;letter-spacing:2px}
.arena::before{left:30px;right:30px}
.stage{font-size:12px;letter-spacing:3px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>JKT48 Theater Seating Stats</h1>
    <p class="sub">Catatan kursi teater yang pernah kamu tempatin</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="peta">Peta Kursi</button>
      <button class="tab-btn" data-tab="crud">Tambah &amp; Kelola Data</button>
    </div>
    <div class="badge">Total Riwayat Show: <span id="total">0</span></div>
  </div>

  <div id="view-peta" class="view active">
    <div id="seating-wrapper">
      <div id="stage-container">
        <div class="stage">PANGGUNG / STAGE</div>
        <div class="arena">
          <div class="catwalk">DERMAGA</div>
          <div id="seating-chart-container"></div>
          <div class="catwalk">DERMAGA</div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-crud" class="view">
    <div class="crud">
      <div class="card">
        <h3 id="form-title">Tambah Riwayat Show</h3>
        <form id="form" novalidate>
          <input type="hidden" id="f-id">
          <div class="fg"><label for="f-seat">Nomor Kursi</label>
            <input id="f-seat" placeholder="A-19 (A19 juga boleh)" style="text-transform:uppercase" autocomplete="off"></div>
          <div class="fg"><label for="f-setlist">Setlist / Event</label>
            <input id="f-setlist" placeholder="Pajama Drive" autocomplete="off"></div>
          <div class="fg"><label for="f-date">Tanggal Show</label>
            <input type="date" id="f-date"></div>
          <div class="fg"><label for="f-sesi">Sesi</label>
            <select id="f-sesi"><option value="">-</option><option value="Siang">Siang</option><option value="Malam">Malam</option></select></div>
          <div class="fg"><label for="f-note">Keterangan / Momen (Opsional)</label>
            <textarea id="f-note" rows="2" placeholder="STS / diwaro member"></textarea></div>
          <div id="extras"></div>
          <div id="msg" role="alert"></div>
          <div class="actions">
            <button type="submit" class="btn main" id="btn-submit">+ Simpan Data</button>
            <button type="button" class="btn" id="btn-cancel">Batal</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="bar">
          <h3>Daftar Riwayat Show</h3>
          <input id="search" placeholder="Cari..." aria-label="Cari riwayat">
        </div>
        <div class="tools">
          <button class="btn" id="btn-export">⬇ Backup (JSON)</button>
          <button class="btn" id="btn-import">⬆ Restore (JSON)</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden>
        </div>
        <div class="scroll">
          <table>
            <thead><tr><th>Kursi</th><th>Setlist</th><th>Tanggal</th><th>Keterangan</th><th>2-Shot / Chekicha</th><th style="width:100px">Aksi</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal riwayat kursi -->
<div class="overlay" id="seat-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" id="seat-close" aria-label="Tutup">&times;</button>
    <h3 id="modal-title" style="margin:0">Riwayat Kursi <span class="seat-badge" id="modal-seat"></span></h3>
    <div class="hist" id="modal-hist"></div>
  </div>
</div>

<!-- Lightbox foto -->
<div class="overlay" id="lightbox"><img id="lb-img" alt="Foto 2-shot"></div>

<!-- Modal konfirmasi -->
<div class="overlay" id="ask-modal">
  <div class="modal" role="alertdialog" aria-modal="true">
    <p id="ask-msg" style="margin:0 0 20px;line-height:1.5"></p>
    <div class="actions" style="margin:0;justify-content:flex-end">
      <button class="btn" id="ask-no">Batal</button>
      <button class="btn main" id="ask-ok" style="flex:none">Ya</button>
    </div>
  </div>
</div>

<script>
const KEY = 'jkt48_theater_stats_v5';
const OLD_KEYS = ['jkt48_theater_stats_v4']; // migrasi otomatis dari versi lama
const $ = id => document.getElementById(id);

// Layout: jumlah kursi per blok (b1..b4) di tiap baris
const COUNTS = {
  A:[4,6,6,5], B:[5,6,6,6], C:[6,6,6,7], D:[7,6,6,7], E:[7,6,6,7],
  F:[7,6,6,7], G:[8,6,6,7], H:[8,6,6,7], I:[8,6,6,6], J:[7,6,6,4]
};
const SEATS = new Set();
const LAYOUT = Object.entries(COUNTS).map(([row, counts]) => {
  let n = 1;
  return counts.map(c => Array.from({length: c}, () => { const code = row + '-' + n++; SEATS.add(code); return code; }));
});

// ---------- Helper ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normSeat(s) {
  const m = String(s || '').trim().toUpperCase().match(/^([A-Z])\s*-?\s*(\d{1,2})$/);
  return m ? m[1] + '-' + Number(m[2]) : '';
}

const KINDS = [
  {k:'ts', q:'2-Shot?', name:'2-Shot', icon:'📸', f:'twoshot', t:'tsType', m:'member', p:'photo',
   types:[['birthday','Birthday 2-Shot'],['roulette','2-Shot Roulette']], short:{birthday:'Birthday 2-Shot', roulette:'2-Shot'}},
  {k:'ck', q:'Chekicha?', name:'Chekicha', icon:'🎴', f:'chekicha', t:'ckType', m:'ckMember', p:'ckPhoto',
   types:[['birthday','Birthday Chekicha'],['roulette','Roulette Chekicha']], short:{birthday:'Birthday Chekicha', roulette:'Chekicha'}}
];
// daftar 2-Shot / Chekicha yang aktif di satu record (roulette ditampilkan singkat)
const extras = r => KINDS.filter(K => r[K.f] === 'Ya')
  .map(K => ({label: K.short[r[K.t]] || K.short.roulette, icon: K.icon, member: r[K.m], photo: r[K.p]}));
const SO = {Malam: 2, Siang: 1};
const cmp = (a, b) => b.date.localeCompare(a.date) || ((SO[b.sesi] || 0) - (SO[a.sesi] || 0));

const okP = p => typeof p === 'string' && p.startsWith('data:image/');
function sanitize(r, i) {
  r = r || {};
  const o = {
    id: Number(r.id) || Date.now() + i,
    seat: normSeat(r.seat) || String(r.seat || '').toUpperCase(),
    setlist: String(r.setlist || ''), date: String(r.date || ''),
    sesi: ['Siang', 'Malam'].includes(r.sesi) ? r.sesi : '',
    note: String(r.note || '')
  };
  for (const K of KINDS) {
    const on = r[K.f] === 'Ya' || r[K.f] === true;
    o[K.f] = on ? 'Ya' : 'Tidak';
    o[K.t] = on ? (r[K.t] === 'birthday' ? 'birthday' : 'roulette') : '';
    o[K.m] = on ? String(r[K.m] || '') : '';
    o[K.p] = on && okP(r[K.p]) ? r[K.p] : '';
  }
  return o;
}

// ---------- Storage + migrasi ----------
function load() {
  for (const k of [KEY, ...OLD_KEYS]) {
    try {
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        const data = arr.map(sanitize);
        if (k !== KEY) localStorage.setItem(KEY, JSON.stringify(data));
        return data;
      }
    } catch (e) { console.error(e); }
  }
  return [];
}
let records = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(records)); } catch (e) { alert('Gagal menyimpan (storage penuh?). Backup dulu lewat tombol Backup. ' + e.message); } };

// ---------- Modal ----------
let askDone = null;
const openEl = id => $(id).classList.add('open');
const closeEl = id => $(id).classList.remove('open');

function ask(msg, okLabel = 'Ya') {
  return new Promise(res => {
    $('ask-msg').textContent = msg;
    $('ask-ok').textContent = okLabel;
    openEl('ask-modal');
    $('ask-ok').focus();
    askDone = v => { askDone = null; closeEl('ask-modal'); res(v); };
  });
}
$('ask-ok').addEventListener('click', () => askDone && askDone(true));
$('ask-no').addEventListener('click', () => askDone && askDone(false));
$('ask-modal').addEventListener('click', e => { if (e.target.id === 'ask-modal' && askDone) askDone(false); });
$('seat-modal').addEventListener('click', e => { if (e.target.id === 'seat-modal') closeEl('seat-modal'); });
$('seat-close').addEventListener('click', () => closeEl('seat-modal'));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('lightbox').classList.contains('open')) closeEl('lightbox');
  else if (askDone) askDone(false); else closeEl('seat-modal');
});

function openSeat(code) {
  $('modal-seat').textContent = code;
  const list = records.filter(r => r.seat === code).sort(cmp);
  $('modal-hist').innerHTML = list.length
    ? list.map(r => `
      <div class="hi">
        <b>${esc(r.setlist)}</b>
        <div class="hd">${esc(r.date)}${r.sesi ? ' · ' + r.sesi : ''}</div>
        ${r.note ? `<div class="hn">"${esc(r.note)}"</div>` : ''}
        ${extras(r).map(x => `<div class="ht">${x.icon} ${esc(x.label)} dengan ${esc(x.member)}</div>${x.photo ? `<img src="${esc(x.photo)}" data-photo alt="Foto">` : ''}`).join('')}
      </div>`).join('')
    : `<div class="empty">Belum ada riwayat show di kursi ${esc(code)}</div>`;
  openEl('seat-modal');
  $('seat-close').focus();
}

// ---------- Render ----------
function renderTheater() {
  const counts = {};
  records.forEach(r => counts[r.seat] = (counts[r.seat] || 0) + 1);
  const seatHTML = code => {
    const c = counts[code] || 0;
    return `<button type="button" class="seat${c ? ' visited' : ''}" data-seat="${code}" aria-label="Kursi ${code}${c ? `, ${c} kali` : ''}">
      <span>${code}</span>${c ? `<span class="seat-count">${c}</span>` : ''}</button>`;
  };
  $('seating-chart-container').innerHTML = [0, 1, 2, 3].map(j =>
    `<div class="seat-block block-${j + 1}">` +
    LAYOUT.map(row => `<div class="seat-row">${row[j].map(seatHTML).join('')}</div>`).join('') +
    '</div>').join('');
  $('total').textContent = records.length;
}

function renderTable() {
  const q = $('search').value.toLowerCase();
  const list = [...records]
    .sort(cmp)
    .filter(r => [r.seat, r.setlist, r.note, r.member, r.ckMember, r.date, r.sesi].some(v => v.toLowerCase().includes(q)));
  $('tbody').innerHTML = list.length ? list.map(r => `
    <tr>
      <td><span class="seat-badge${SEATS.has(r.seat) ? '' : ' bad'}" ${SEATS.has(r.seat) ? '' : 'title="Kursi tidak ada di peta — edit supaya muncul"'}>${esc(r.seat)}</span></td>
      <td><b>${esc(r.setlist)}</b></td>
      <td>${esc(r.date)}${r.sesi ? ' · ' + r.sesi : ''}</td>
      <td>${esc(r.note) || '-'}</td>
      <td>${exCell(r)}</td>
      <td>
        <button class="act edit" data-act="edit" data-id="${r.id}">Edit</button>
        <button class="act del" data-act="del" data-id="${r.id}">Hapus</button>
      </td>
    </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:#71717a">Data tidak ditemukan</td></tr>';
}

const renderAll = () => { renderTheater(); renderTable(); };

// ---------- Tab ----------
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'peta') requestAnimationFrame(centerChart);
}
function fitChart() {
  const w = $('seating-wrapper'), c = $('stage-container');
  c.style.zoom = '';
  if (!w.clientWidth) return; // tab tersembunyi
  if (window.innerWidth > 768 && c.scrollWidth > w.clientWidth) c.style.zoom = (w.clientWidth / c.scrollWidth).toFixed(3);
}
window.addEventListener('resize', () => { fitChart(); centerChart(); });
function centerChart() {
  fitChart();
  const w = $('seating-wrapper'), c = $('stage-container');
  w.scrollLeft = (c.scrollWidth - w.clientWidth) / 2;
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ---------- Form ----------
const setMsg = t => $('msg').textContent = t || '';

$('extras').innerHTML = KINDS.map(K => `
  <div class="fg"><label for="f-${K.k}">${K.q}</label>
    <select id="f-${K.k}"><option value="Tidak">Tidak</option><option value="Ya">Ya</option></select></div>
  <div id="box-${K.k}" style="display:none">
    <div class="fg"><label for="t-${K.k}">Jenis ${K.name}</label>
      <select id="t-${K.k}">${K.types.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="fg"><label for="m-${K.k}">${K.name} dengan</label>
      <input id="m-${K.k}" placeholder="Nama Member" autocomplete="off"></div>
    <div class="fg"><label for="p-${K.k}">Foto ${K.name} (Opsional)</label>
      <input type="file" id="p-${K.k}" accept="image/*">
      <div class="pprev" id="pv-${K.k}"><img id="pi-${K.k}" alt="Preview foto"><button type="button" class="btn" id="pr-${K.k}">Hapus foto</button></div></div>
  </div>`).join('');

const cur = { ts: '', ck: '' };
function setPhoto(k, d) {
  cur[k] = d || '';
  $('p-' + k).value = '';
  $('pi-' + k).src = cur[k];
  $('pv-' + k).style.display = cur[k] ? 'flex' : 'none';
}
// Kompres foto (maks 900px, JPEG) supaya hemat localStorage
function compress(file, max = 900, q = 0.75) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}
function toggleBox(k) {
  const on = $('f-' + k).value === 'Ya';
  $('box-' + k).style.display = on ? 'block' : 'none';
  if (!on) { $('m-' + k).value = ''; $('t-' + k).selectedIndex = 0; setPhoto(k, ''); }
}
const toggleAll = () => KINDS.forEach(K => toggleBox(K.k));
KINDS.forEach(K => {
  $('f-' + K.k).addEventListener('change', () => toggleBox(K.k));
  $('pr-' + K.k).addEventListener('click', () => setPhoto(K.k, ''));
  $('p-' + K.k).addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { setPhoto(K.k, await compress(f)); setMsg(''); }
    catch (err) { setPhoto(K.k, ''); setMsg(err.message + '. Coba format JPG/PNG.'); }
  });
});
document.addEventListener('click', e => {
  const im = e.target.closest('img[data-photo]');
  if (!im) return;
  $('lb-img').src = im.src;
  openEl('lightbox');
});
$('lightbox').addEventListener('click', () => closeEl('lightbox'));

const exCell = r => {
  const e = extras(r);
  return e.length ? e.map(x => `<div><span class="ts-ya">${esc(x.label)} (${esc(x.member) || '-'})</span>${x.photo ? `<img class="thumb" src="${esc(x.photo)}" data-photo alt="Foto">` : ''}</div>`).join('')
                  : '<span class="ts-no">-</span>';
};

function resetForm() {
  $('form').reset();
  $('f-id').value = '';
  $('form-title').textContent = 'Tambah Riwayat Show';
  $('btn-submit').textContent = '+ Simpan Data';
  $('btn-cancel').style.display = 'none';
  setMsg('');
  toggleAll();
}
$('btn-cancel').addEventListener('click', resetForm);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  setMsg('');
  const id = Number($('f-id').value) || 0;
  const seat = normSeat($('f-seat').value);
  const setlist = $('f-setlist').value.trim();
  const date = $('f-date').value;
  const note = $('f-note').value.trim();
  const sesi = $('f-sesi').value;
  const ex = {};
  for (const K of KINDS) {
    const on = $('f-' + K.k).value === 'Ya';
    ex[K.f] = on ? 'Ya' : 'Tidak';
    ex[K.t] = on ? $('t-' + K.k).value : '';
    ex[K.m] = on ? $('m-' + K.k).value.trim() : '';
    ex[K.p] = on ? cur[K.k] : '';
  }

  if (!SEATS.has(seat)) return setMsg('Kursi tidak valid / tidak ada di peta. Contoh: A-19, B-7, J-23.');
  if (!setlist) return setMsg('Setlist wajib diisi.');
  if (!date) return setMsg('Tanggal wajib diisi.');
  for (const K of KINDS) if (ex[K.f] === 'Ya' && !ex[K.m]) return setMsg(`Nama member ${K.name} wajib diisi.`);

  const dup = records.some(r => r.id !== id && r.seat === seat && r.date === date &&
    r.setlist.toLowerCase() === setlist.toLowerCase() && r.sesi === sesi);
  if (dup && !await ask('Data dengan kursi, setlist, tanggal, dan sesi yang sama sudah ada. Tetap simpan?', 'Tetap simpan')) return;

  const rec = { id: id || Date.now(), seat, setlist, date, sesi, note, ...ex };
  if (id) {
    const i = records.findIndex(r => r.id === id);
    if (i !== -1) records[i] = rec; else records.push(rec);
  } else records.push(rec);

  save();
  resetForm();
  renderAll();
});

// ---------- Aksi tabel & peta ----------
$('tbody').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const rec = records.find(r => r.id === id);
  if (!rec) return;

  if (btn.dataset.act === 'edit') {
    $('f-id').value = rec.id;
    $('f-seat').value = rec.seat;
    $('f-setlist').value = rec.setlist;
    $('f-date').value = rec.date;
    $('f-sesi').value = rec.sesi;
    $('f-note').value = rec.note;
    KINDS.forEach(K => {
      $('f-' + K.k).value = rec[K.f];
      toggleBox(K.k);
      if (rec[K.f] === 'Ya') {
        $('t-' + K.k).value = rec[K.t] || 'roulette';
        $('m-' + K.k).value = rec[K.m];
        setPhoto(K.k, rec[K.p]);
      }
    });
    $('form-title').textContent = 'Edit Data Riwayat';
    $('btn-submit').textContent = 'Update Data';
    $('btn-cancel').style.display = 'block';
    setMsg('');
    $('form').scrollIntoView({ behavior: 'smooth' });
  } else if (await ask(`Hapus riwayat ${rec.seat} — ${rec.setlist} (${rec.date})?`, 'Hapus')) {
    records = records.filter(r => r.id !== id);
    save();
    renderAll();
  }
});

$('seating-chart-container').addEventListener('click', e => {
  const b = e.target.closest('[data-seat]');
  if (b) openSeat(b.dataset.seat);
});
$('search').addEventListener('input', renderTable);

// ---------- Backup / Restore ----------
$('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `jkt48-seat-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('btn-import').addEventListener('click', () => $('file-import').click());
$('file-import').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const arr = JSON.parse(await file.text());
    if (!Array.isArray(arr)) throw new Error('Format bukan array');
    const ids = new Set(records.map(r => r.id));
    const fresh = arr.map(sanitize).filter(r => !ids.has(r.id));
    if (!await ask(`Gabungkan ${fresh.length} data baru dari file ini? (data yang id-nya sama dilewati)`, 'Gabungkan')) return;
    records.push(...fresh);
    save();
    renderAll();
  } catch (err) {
    alert('File tidak valid: ' + err.message);
  }
});

// ---------- Init ----------
renderAll();
requestAnimationFrame(centerChart);
</script>
</body>
</html>
