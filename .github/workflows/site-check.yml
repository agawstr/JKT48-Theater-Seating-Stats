name: Site check

# Setiap kali data.json / foto di-upload:
#   1. validasi data (gagal = jangan dipublish)
#   2. buat thumbnail di photos/t/ lalu commit otomatis
on:
  push:
    branches: [main]
    paths:
      - data.json
      - 'photos/**'
      - '!photos/t/**'   # commit thumbnail dari bot tidak memicu ulang
      - assets/js/shared.js
      - scripts/**
      - .github/workflows/site-check.yml
  pull_request:
    paths:
      - data.json
      - 'photos/**'
      - assets/js/shared.js
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang Pillow
        run: pip install pillow

      - name: Validasi data.json
        run: python scripts/validate_data.py

      - name: Buat thumbnail
        run: python scripts/make_thumbs.py

      - name: Commit thumbnail (hanya di main)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos/t
          if git diff --cached --quiet; then
            echo "Thumbnail sudah up to date."
            exit 0
          fi
          git commit -m "chore: update thumbnail [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
