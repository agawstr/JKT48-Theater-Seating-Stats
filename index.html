<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agaxx's Theater Stats</title>
<link rel="stylesheet" href="shared.css">
<style>
#status{color:#f87171;font-size:14px;margin:12px 0;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>agaxx's Theater Seating Stats</h1>
    <p class="sub">Riwayat kursi teater yang pernah ditempati (kursi bisa diklik)</p>
    <div class="badge">Total Riwayat Show: <span id="total">0</span></div>
  </div>
  <div id="status" role="status">Memuat data...</div>
  <div id="seating-wrapper">
    <div id="stage-container">
      <div class="stage">STAGE</div>
      <div class="arena">
        <div class="catwalk">DERMAGA</div>
        <div id="chart"></div>
        <div class="catwalk">DERMAGA</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="seat-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" id="seat-close" aria-label="Tutup">&times;</button>
    <h3 id="modal-title" style="margin:0">Riwayat Kursi <span class="seat-badge" id="modal-seat"></span></h3>
    <div class="hist" id="modal-hist"></div>
  </div>
</div>
<div class="overlay" id="lightbox"><img id="lb-img" alt="Foto 2-shot"></div>

<script src="shared.js"></script>
<script>
/* DATA_URL: file data.json hasil "Unduh data.json" dari admin.html (array, atau {records:[...]}).
   Kalau dibuka langsung dari file:// browser memblokir fetch -> pakai hosting / server lokal. */
const DATA_URL = './data.json';

async function init() {
  renderChart(); // peta kosong dulu biar layout langsung muncul
  try {
    const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const arr = Array.isArray(json) ? json : json.records;
    if (!Array.isArray(arr)) throw new Error('Format data tidak dikenali');
    records = arr.map(sanitize).filter(r => SEATS.has(r.seat)); // kursi di luar peta dilewati, jadi total = yang tampil di peta
    $('status').textContent = '';
    renderChart();
  } catch (err) {
    $('status').textContent = 'Gagal memuat data (' + err.message + '). Cek DATA_URL / pastikan dibuka lewat server, bukan file://.';
  }
}
init();
</script>
</body>
</html>
