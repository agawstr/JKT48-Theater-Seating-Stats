<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agaxx's Theater Stats</title>
<meta name="theme-color" content="#0d090d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ff2a5f%27/%3E%3Cpath d=%27M14 38h36M14 28h36M14 48h36%27 stroke=%27%23fff%27 stroke-width=%275%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3Cpath d=%27M12 20q20-12 40 0%27 stroke=%27%23ffd23f%27 stroke-width=%275%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="agaxx's Theater Seating Stats">
<meta property="og:description" content="Riwayat kursi teater JKT48 yang pernah ditempati: peta kursi, statistik, dan total kunjungan per setlist.">
<meta property="og:image" content="https://USERNAME.github.io/NAMA-REPO/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
#status{color:#f87171;font-size:14px;margin:0 0 12px;text-align:center}
#status:empty{display:none}
#status.warn{color:#fbbf24}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>agaxx's Theater Seating Stats</h1>
    <p class="sub">Riwayat kursi teater yang pernah ditempati (arahkan kursor atau klik kursi)</p>
    <div class="badge">Total Riwayat Show: <span id="total">0</span></div>
  </div>
  <div class="tabbar"><button type="button" class="tab on" data-tab="main">Peta &amp; Statistik</button><button type="button" class="tab" data-tab="tl" id="t-tab">Riwayat</button><button type="button" class="tab" data-tab="gal" id="g-tab">Galeri</button><button type="button" class="tab" data-tab="ev" id="ev-tab">Tiket &amp; Event</button></div>
  <div id="status" role="status">Memuat data...</div>
  <div id="view-main">
  <div id="seating-wrapper">
    <div id="stage-container">
      <div class="stage">STAGE</div>
      <div class="arena">
        <div class="catwalk">DERMAGA</div>
        <div id="chart"></div>
        <div class="catwalk">DERMAGA</div>
      </div>
    </div>
  </div>
  </div>
  <div id="view-gal" hidden>
    <div id="gallery-bar"><select id="g-member" aria-label="Filter member galeri"></select><span id="g-info"></span></div>
    <div id="gallery"></div>
  </div>
  <div id="view-tl" hidden>
    <div id="tl-bar"><input type="search" id="tl-q" placeholder="Cari setlist, member, kursi, catatan…" aria-label="Cari riwayat" autocomplete="off"><span id="tl-info"></span></div>
    <div id="timeline"></div>
  </div>
  <div id="view-ev" hidden>
    <h2 class="sec" style="margin-top:0">Statistik lotre</h2>
    <div id="lot"></div>
    <h2 class="sec">Meet &amp; greet, special show, dan event</h2>
    <div id="ev-up"></div>
    <div id="ev-cats"></div>
    <div id="ev-bar">
      <select id="ev-member" aria-label="Member"></select>
      <select id="ev-status" aria-label="Status"><option value="">Semua status</option><option value="used">Hadir saja</option></select>
      <span id="ev-info"></span>
    </div>
    <div id="ev-rank"></div>
    <div id="ev-list"></div>
    <button type="button" class="btn-s" id="ev-more" hidden>Tampilkan lebih banyak</button>
  </div>
  <footer id="foot" class="foot"></footer>
</div>

<div class="overlay" id="seat-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" id="seat-close" aria-label="Tutup">&times;</button>
    <h3 id="modal-title" style="margin:0">Riwayat Kursi <span class="seat-badge" id="modal-seat"></span></h3>
    <div class="hist" id="modal-hist"></div>
  </div>
</div>
<div class="overlay" id="lightbox"><img id="lb-img" alt="Foto 2-shot"></div>

<script src="shared.js"></script>
<script>
/* DATA_URL: file data.json hasil "Unduh data.json" dari admin.html (array, atau {records:[...]}).
   Kalau dibuka langsung dari file:// browser memblokir fetch -> pakai hosting / server lokal. */
const DATA_URL = './data.json';

const CK = 'jkt48_data_cache_v1'; // salinan data terakhir di perangkat pengunjung
function applyData(json) {
  const arr = Array.isArray(json) ? json : json.records;
  if (!Array.isArray(arr)) throw new Error('Format data tidak dikenali');
  records = arr.map(sanitize).filter(r => SEATS.has(r.seat)); // kursi di luar peta dilewati, jadi total = yang tampil di peta
  tickets = (Array.isArray(json.tickets) ? json.tickets : []).map(sanitizeTicket).filter(t => t.date);
  solo = (Array.isArray(json.solo) ? json.solo : []).map(sanitizeSolo).filter(w => w.date);
  dataLoaded = true;
  $('foot').textContent = json.updated ? 'Data diperbarui: ' + fmtDate(json.updated) : '';
}
async function init() {
  renderChart(); skeleton(); // peta kosong dulu biar layout langsung muncul
  let old = null;
  try { old = localStorage.getItem(CK); } catch (e) {}
  if (old) { // tampilkan salinan terakhir dulu sementara data terbaru dimuat
    try { applyData(JSON.parse(old)); $('status').textContent = ''; renderChart(); } catch (e) { old = null; }
  }
  try {
    const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (text !== old) { // hanya render ulang kalau data berubah
      applyData(JSON.parse(text)); $('status').textContent = ''; renderChart();
      try { localStorage.setItem(CK, text); } catch (e) { /* penyimpanan penuh: abaikan */ }
    }
    $('status').classList.remove('warn');
  } catch (err) {
    $('status').classList.toggle('warn', !!old);
    $('status').textContent = old ? 'Tidak bisa memuat data terbaru, menampilkan salinan terakhir yang tersimpan di perangkat ini.'
      : 'Gagal memuat data (' + err.message + '). Cek DATA_URL / pastikan dibuka lewat server, bukan file://.';
    if (!old) renderChart();
  }
}
let tabTimer = 0;
const VIEWS = ['main', 'gal', 'tl', 'ev'];
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  const tl = [...document.querySelectorAll('.tab')], from = tl.findIndex(t => t.classList.contains('on')), to = tl.indexOf(b);
  if (to === from) return;
  const dir = to > from ? 1 : -1, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const prev = VIEWS.map(k => $('view-' + k)).find(v => !v.hidden), next = $('view-' + b.dataset.tab);
  tl.forEach(t => { t.classList.toggle('on', t === b); t.setAttribute('aria-selected', t === b); });
  const show = () => {
    VIEWS.forEach(k => $('view-' + k).hidden = b.dataset.tab !== k);
    flushLazy('view-' + b.dataset.tab); // gambar ulang isi tab yang usang sebelum ditampilkan
    const hd = document.querySelector('.head'), top = hd.getBoundingClientRect().bottom + scrollY - 8; // posisi tab bar sebelum menempel
    if (scrollY > top) scrollTo({top, behavior: 'instant'}); // isi baru mulai dari bawah tab bar, bukan di tengah halaman
    centerChart();
    next.style.setProperty('--tabx', dir * 18 + 'px');
    playEnter(next);
  };
  clearTimeout(tabTimer);
  if (prev && prev !== next && !still) {
    prev.style.setProperty('--tabx', dir * 18 + 'px');
    prev.classList.add('leave');
    tabTimer = setTimeout(() => { prev.classList.remove('leave'); show(); }, 90);
  } else show();
}));
// geser kiri/kanan untuk pindah tab (layar sentuh)
(() => {
  let x0 = 0, y0 = 0, ok = false;
  const skip = el => el.closest('#seating-wrapper, #cal, select, input, .overlay, #fbar, .ev-d');
  document.addEventListener('touchstart', e => { ok = e.touches.length === 1 && !skip(e.target); x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!ok) return;
    ok = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    const tabs = [...document.querySelectorAll('.tab')].filter(b => !b.hidden), i = tabs.findIndex(b => b.classList.contains('on'));
    const n = tabs[i + (dx < 0 ? 1 : -1)];
    if (n) n.click();
  }, {passive: true});
})();
init();
</script>
</body>
</html>
