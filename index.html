<script>
/* DATA_URL: file data.json hasil "Unduh data.json" dari admin.html (array, atau {records:[...]}).
   Kalau dibuka langsung dari file:// browser memblokir fetch -> pakai hosting / server lokal. */
const DATA_URL = './data.json';

const CK = 'jkt48_data_cache_v1'; // salinan data terakhir di perangkat pengunjung
function applyData(json) {
  const arr = Array.isArray(json) ? json : json.records;
  if (!Array.isArray(arr)) throw new Error('Format data tidak dikenali');
  records = arr.map(sanitize).filter(r => SEATS.has(r.seat)); // kursi di luar peta dilewati, jadi total = yang tampil di peta
  tickets = (Array.isArray(json.tickets) ? json.tickets : []).map(sanitizeTicket).filter(t => t.date);
  solo = (Array.isArray(json.solo) ? json.solo : []).map(sanitizeSolo).filter(w => w.date);
  dataLoaded = true;
  $('foot').textContent = json.updated ? 'Data diperbarui: ' + fmtDate(json.updated) : '';
}
// layar muat: hanya tampil di kunjungan pertama (belum ada salinan data); menutup halaman sampai data siap
function hideSplash(delay = 0) {
  const s = document.getElementById('splash');
  if (!s) return;
  setTimeout(() => { s.classList.add('done'); setTimeout(() => s.remove(), 700); }, delay);
}
setTimeout(hideSplash, 12000); // jaga-jaga kalau sesuatu macet
async function init() {
  const t0 = performance.now();
  renderChart(); skeleton(); // peta kosong dulu biar layout langsung muncul
  let old = null;
  try { old = localStorage.getItem(CK); } catch (e) {}
  if (old) { // tampilkan salinan terakhir dulu sementara data terbaru dimuat
    try { applyData(JSON.parse(old)); $('status').textContent = ''; renderChart(); } catch (e) { old = null; }
  }
  try {
    const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (text !== old) { // hanya render ulang kalau data berubah
      applyData(JSON.parse(text)); $('status').textContent = ''; renderChart();
      try { localStorage.setItem(CK, text); } catch (e) { /* penyimpanan penuh: abaikan */ }
    }
    $('status').classList.remove('warn');
  } catch (err) {
    $('status').classList.toggle('warn', !!old);
    $('status').textContent = old ? 'Tidak bisa memuat data terbaru, menampilkan salinan terakhir yang tersimpan di perangkat ini.'
      : 'Gagal memuat data (' + err.message + '). Cek DATA_URL / pastikan dibuka lewat server, bukan file://.';
    if (!old) renderChart();
  }
  hideSplash(Math.max(0, 600 - (performance.now() - t0))); // tampil minimal sebentar supaya tidak berkedip
}
// dipakai app.js (tarik ke bawah untuk memuat ulang): selalu ambil data terbaru dan gambar ulang
async function refreshData() {
  const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  applyData(JSON.parse(text));
  $('status').textContent = ''; $('status').classList.remove('warn');
  renderChart();
  try { localStorage.setItem(CK, text); } catch (e) { /* penyimpanan penuh: abaikan */ }
}
// pindah tab (klik, geser jari, keyboard) ditangani switchTab() di app.js
init();
</script>
